---
layout: default
---
<article class="container page">
  <header class="entry-header">
    <h1>{{ page.title }}</h1>
    {% if page.tech %}
    <ul class="tag-list">
      {% for tech in page.tech %}<li class="tag">{{ tech }}</li>{% endfor %}
    </ul>
    {% endif %}
  </header>
  <div class="page-body">
    {{ content }}
    {% if page.link %}
    <p><a class="btn" href="{{ page.link }}" target="_blank" rel="noopener">View project ↗</a></p>
    {% endif %}
  </div>
</article>
