title: Arman Gholibeikian
email: arman.ghbn@gmail.com
description: >-
  Personal portfolio of Arman Gholibeikian, MSc Mechatronics Engineering
  student at K. N. Toosi University of Technology.

# Default username.github.io URL. If this repo is NOT named <username>.github.io
# the site is served under /<repo-name>/ and baseurl must be "/<repo-name>".
baseurl: ""
url: "https://armangb1.github.io"

permalink: pretty

exclude:
  - vendor/
  - .bundle/
  - Gemfile
  - Gemfile.lock
  - AGENTS.md
  - _projects/TEMPLATE.md
  - _achievements/TEMPLATE.md

collections:
  projects:
    output: true
    permalink: /projects/:slug/
  achievements:
    output: true
    permalink: /achievements/:slug/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: achievements
    values:
      layout: achievement
