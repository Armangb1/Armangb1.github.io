bio: |
    I'm Arman, a mechatronics engineering master's student (mechanical engineering background) working across control systems, data-driven modeling, and reinforcement learning. The throughline across my projects — from data-driven dynamics of a tendon-driven continuum robot to using RL to detect and mitigate cyber-physical attacks on autonomous systems — is a single goal: building autonomous systems that are safe, reliable, and able to work alongside people. I also TA a machine learning course, designing hands-on exercises for students. I'm currently looking for PhD positions and job opportunities in secure, trustworthy autonomy.

